    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('toyland_theme');
          if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-amber-50/40 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased font-['Vazirmatn',sans-serif] selection:bg-amber-400 selection:text-amber-950 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
